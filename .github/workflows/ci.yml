name: DNS Wiki migration lock generation
on:
  push:
    branches: [codex/wiki-foundation-package]
permissions:
  contents: write
jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile from dependency manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated npm lockfile to migration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "chore: generate Wiki dependency lockfile with npm"
          git push origin "HEAD:${GITHUB_REF_NAME}"
